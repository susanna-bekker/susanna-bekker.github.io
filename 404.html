<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Not found &mdash; Susanna Bekker</title>
  <meta name="color-scheme" content="light dark">
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='34' fill='none' stroke='%235b6ee1' stroke-width='8'/><circle cx='50' cy='16' r='9' fill='%235b6ee1'/></svg>">
  <style>
    :root {
      --bg: #fbfbfd;
      --text: #1a1a20;
      --muted: #6a6a78;
      --accent: #4a5bd0;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0e0e13;
        --text: #ececf2;
        --muted: #9a9aad;
        --accent: #8f9cf5;
      }
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-content: center;
      text-align: center;
      padding: 1.5rem;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        "Helvetica Neue", Arial, sans-serif;
    }

    h1 {
      margin: 0 0 .5rem;
      font-size: 3rem;
      font-weight: 650;
      letter-spacing: -.02em;
    }

    p {
      margin: 0 0 1.75rem;
      color: var(--muted);
    }

    a {
      color: var(--accent);
    }
  </style>
</head>

<body>
  <main>
    <h1>404</h1>
    <p>That page drifted out of orbit.</p>
    <a href="/">Back to the home page</a>
  </main>
</body>

</html>
